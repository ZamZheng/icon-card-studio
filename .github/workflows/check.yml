name: Check toolkit
on: [push, pull_request]
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run sample
      - name: Check private upload service
        run: |
          mkdir -p site/.openai
          cp site/hosting.example.json site/.openai/hosting.json
          npm --prefix site run build
          npm --prefix site test
      - uses: actions/upload-artifact@v4
        with:
          name: engineering-preview
          path: output/engineering-preview.*
          retention-days: 7
