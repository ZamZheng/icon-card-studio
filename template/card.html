<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>康复小纸条</title><meta name="viewport" content="width=device-width, initial-scale=1"></head>
<body><main id="card" aria-label="康复小纸条图文卡片">
  <div id="background" aria-hidden="true"></div>
  <div id="portrait-frame" aria-hidden="true"><div id="portrait-ring"></div><img id="portrait" alt="本期人物肖像"></div>
  <img id="logo" alt="ICON CANCER CENTRE ICON肿瘤中心">
  <div id="masthead-rule" aria-hidden="true"></div>
  <header id="masthead" data-role="column" data-region="栏目头"><span id="column"></span><span id="issue"></span></header>
  <h1 id="title" data-role="title" data-region="主标题"></h1>
  <div id="underline" aria-hidden="true"></div>
  <p id="introduction" data-role="introduction" data-region="引导语"></p>
  <ol id="points" aria-label="核心知识点"></ol>
  <aside id="reminder-panel"><div id="reminder-icon" aria-hidden="true"></div><div id="reminder-copy"><h2 id="reminder-heading" data-role="reminderHeading" data-region="提醒标题">一份重要提醒</h2><p id="reminder" data-role="reminderBody" data-region="提醒正文"></p></div></aside>
  <footer id="signature" data-region="组织落款"><span id="signature-symbol" aria-hidden="true"></span><span data-role="signature"><span id="community-lead"></span> <span id="community-name"></span></span></footer>
  <div id="diagnostic-watermark" hidden>工程预览 · 品牌资产未齐</div>
</main></body></html>
